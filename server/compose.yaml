# ./gradlew bootRun 을 실행하면 Spring Boot가 이 파일의 컨테이너를 띄우고 접속 정보를 알아서 연결한다.
services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_DB: planny
      POSTGRES_USER: planny
      POSTGRES_PASSWORD: planny
    ports:
      - '5432'

  # otel 프로필로 실행할 때만 뜬다. 트레이스(Tempo)와 메트릭(Prometheus)을 Grafana에서 본다
  grafana-lgtm:
    image: grafana/otel-lgtm:0.41.1
    profiles: [observability]
    ports:
      # Next 개발 서버가 3000을 써서 Grafana는 3001로 연다
      - '3001:3000'
      - '4317'
      - '4318'
