# 서버 의존성, Docker 이미지, GitHub Actions 버전을 매주 확인하고 올리는 PR을 만든다.
# 프론트(npm)는 아직 넣지 않았다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /server
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: [chore, "C: 서버"]
    commit-message:
      prefix: chore
    groups:
      # 마이너, 패치 업데이트는 PR 하나로 묶는다. 메이저 업데이트는 따로 온다
      server-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Dockerfile의 Temurin 베이스 이미지 다이제스트
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: [chore, "C: 서버"]
    commit-message:
      prefix: chore

  # compose.yaml의 PostgreSQL, Grafana LGTM 이미지
  - package-ecosystem: docker-compose
    directory: /server
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: [chore, "C: 서버"]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    labels: [chore]
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
