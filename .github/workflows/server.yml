# server/ 폴더가 바뀐 PR과 main 푸시에서 서버를 빌드하고 테스트한다 (Testcontainers로 실제 PostgreSQL을 띄운다).
# main에서는 컨테이너 이미지를 GitHub Container Registry(ghcr.io)에 올리고 빌드 출처 증명을 남긴다.
# 액션은 커밋 SHA로 고정하고, 버전은 Dependabot이 올린다.
name: 서버 CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

# 같은 PR에 커밋이 연달아 올라오면 앞의 실행은 취소한다. main 실행은 끝까지 둔다
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      # Gradle 캐시를 쓰고, 저장소의 gradle-wrapper.jar가 공식 파일인지 확인한다
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: 빌드와 테스트
        run: ./gradlew build

      - name: 실패한 테스트 결과 올리기
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: server/build/reports/tests/test/

      # 프론트에서 API 타입을 만들 때 쓸 수 있는 OpenAPI 문서 (ApiDocsTests가 만든다)
      - name: OpenAPI 문서 올리기
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi
          path: server/build/openapi.json
          if-no-files-found: error

  image:
    name: 이미지 올리기
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # ghcr.io에 이미지 올리기
      id-token: write # 빌드 출처 증명에 서명하기
      attestations: write # 빌드 출처 증명 저장하기
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/planny-server
          tags: |
            type=sha
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 이 이미지가 이 저장소의 이 커밋에서 이 워크플로로 만들어졌다는 서명된 기록 (SLSA 빌드 출처)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/planny-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
