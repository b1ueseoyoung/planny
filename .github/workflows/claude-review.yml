# PR이 열리거나 업데이트되면 Claude가 자동으로 코드 리뷰를 달아요.
# 인증은 저장소 주인의 Claude 구독 토큰(CLAUDE_CODE_OAUTH_TOKEN 시크릿)을 써요. API 크레딧은 쓰지 않아요.
# 리뷰 언어·규칙은 저장소 루트의 CLAUDE.md를 따라요.
# 참고: https://code.claude.com/docs/en/github-actions
name: Claude 코드 리뷰

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# 같은 PR에 커밋이 연달아 올라오면 앞의 리뷰는 취소하고 마지막 것만 돌려요
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # 포크에서 온 PR은 시크릿을 쓸 수 없어서 건너뛰어요 (같은 저장소 브랜치의 PR만 리뷰)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 초안(draft) PR, 닫힌 PR, 너무 작은 PR, 이미 Claude 리뷰가 달린 PR은 플러그인이 알아서 건너뛰어요
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
